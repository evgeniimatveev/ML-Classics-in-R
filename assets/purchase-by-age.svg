<text x="216.8" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">4%<tspan font-weight="400" fill="#cfe3ff" dx="8">4 of 100 users bought</tspan></text>
<text x="176" y="188" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eaf3ff">30–39</text>
