<text x="580.0" y="281" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">90.6%<tspan font-weight="400" fill="#cfe3ff" dx="8">48 of 53 users bought</tspan></text>
<text x="32" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9fb8dc">Computed from data/social-network-ads.csv</text>
