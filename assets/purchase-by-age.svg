<text x="297.3" y="189" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">23.2%<tspan font-weight="400" fill="#cfe3ff" dx="8">32 of 138 users bought</tspan></text>
<text x="176" y="234" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eaf3ff">40–49</text>
