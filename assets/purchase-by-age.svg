<text x="426.9" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">54.1%<tspan font-weight="400" fill="#cfe3ff" dx="8">59 of 109 users bought</tspan></text>
<text x="176" y="280" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eaf3ff">50 and over</text>
