<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="ML Classics in R banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b3a"/>
      <stop offset="0.6" stop-color="#14306b"/>
      <stop offset="1" stop-color="#276DC3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <!-- decorative scatter with three clusters and a regression line -->
  <g transform="translate(860 40)">
    <line x1="0" y1="215" x2="360" y2="215" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="0" y1="215" x2="0" y2="0" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <g fill="#75AADB" opacity="0.95"><circle cx="40" cy="170" r="7"/><circle cx="62" cy="150" r="7"/><circle cx="85" cy="176" r="7"/><circle cx="58" cy="190" r="7"/><circle cx="100" cy="158" r="7"/></g>
    <g fill="#ffb347" opacity="0.95"><circle cx="170" cy="110" r="7"/><circle cx="195" cy="92" r="7"/><circle cx="150" cy="96" r="7"/><circle cx="188" cy="128" r="7"/><circle cx="215" cy="108" r="7"/></g>
    <g fill="#9fe6a0" opacity="0.95"><circle cx="290" cy="50" r="7"/><circle cx="315" cy="34" r="7"/><circle cx="270" cy="30" r="7"/><circle cx="312" cy="66" r="7"/><circle cx="338" cy="48" r="7"/></g>
    <path d="M10 195 L350 22" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- title -->
  <text x="64" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#9fd0ff" letter-spacing="6">MACHINE LEARNING A–Z</text>
  <text x="62" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff">ML Classics in R</text>
  <text x="64" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#dbe9ff">Regression · Classification · Clustering · Association Rules</text>
</svg>
